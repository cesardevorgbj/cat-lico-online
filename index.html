<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Católico Online • Em Manutenção</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg,#ffffff,#ffffff);
      color:#fff;
      padding:20px;
    }
    .container{
      max-width:1100px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.15);
      border-radius:24px;
      padding:40px;
      backdrop-filter:blur(10px);
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:40px;
      align-items:center;
      box-shadow:0 20px 50px rgba(0,0,0,.35);
    }
    img{width:100%;max-width:500px}
    h1{font-size:3rem;color:#daac42;margin-bottom:20px}
    p{font-size:1.2rem;line-height:1.7;color:#000000;margin-bottom:25px}
    .btn{
      display:inline-block;
      padding:14px 28px;
      background:#ffd36a;
      color:#b9a700;
      text-decoration:none;
      border-radius:14px;
      font-weight:bold;
      transition:.3s;
    }
    .btn:hover{transform:translateY(-4px)}
    .status{margin-top:20px;font-size:.95rem;opacity:.8}
    @media(max-width:900px){
      .container{grid-template-columns:1fr;text-align:center}
      h1{font-size:2.2rem}
    }
  </style>
</head>
<body>
  <div class="container">
    <div>
      <img src="https://i.postimg.cc/bJYs3Mtf/image.png" alt="Dom Nico consertando o sistema">
    </div>
    <div>
      <h1>Estamos em manutenção</h1>
      <p>
        Dom Nico está trabalhando para deixar o <strong>Católico Online</strong> ainda melhor para você.
        Em breve retornaremos com uma experiência renovada, mais rápida e organizada.
      </p>
      <a class="btn" href="https://discord.gg/uHR9nqrMCC" target="_blank">Entrar no Discord</a>
      <div class="status">“Tudo para maior glória de Deus.”</div>
    </div>
  </div>
</body>
</html>
